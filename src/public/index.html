<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Redis Migration & CDC POC</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Redis Migration & CDC POC</h1>

<div class="app-sections">

    <div class="app-card">

        <h2>Application A (Redis A)</h2>

        <input id="appAId" placeholder="ID">

        <input id="appAName" placeholder="Name">

        <input id="appAEmail" placeholder="Email">

        <div>

            <button onclick="appACreate()">Create</button>
            <button onclick="appAUpdate()">Update</button>
            <button onclick="appADelete()">Delete</button>

        </div>

    </div>

    <div class="app-card">

        <h2>Application B (Redis B)</h2>

        <input id="appBId" placeholder="ID">

        <input id="appBName" placeholder="Name">

        <input id="appBEmail" placeholder="Email">

        <div>

            <button onclick="appBCreate()">Create</button>
            <button onclick="appBUpdate()">Update</button>
            <button onclick="appBDelete()">Delete</button>

        </div>

    </div>

</div>

<hr>

<div class="migration-panel">

    <h2>Migration</h2>

    <button onclick="migrate()">

        Migrate Redis A → Redis B

    </button>

    <div id="status"></div>

</div>

<hr>

<h2>Migration Conflicts</h2>

<div
    id="migrationConflicts"
    class="conflict-container"
></div>

<hr>

<h2>CDC Conflicts</h2>

<div
    id="cdcConflicts"
    class="conflict-container"
></div>

<hr>

<h2>Current Redis Data</h2>

<div class="json-sections">

    <div class="json-card">

        <h3>Redis A</h3>

        <div id="redisATable"></div>

    </div>

    <div class="json-card">

        <h3>Redis B</h3>

        <div id="redisBTable"></div>

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
